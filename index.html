<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三缺一棋牌館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 版面：木框牌館 — 上方招牌列、中央綠絨桌面、各座位圍在桌邊。單一深色風格。 */
:root{
  --felt:#173a30; --felt-hi:#1f4a3d; --felt-lo:#0f2a22;
  --wood:#2b1a12; --wood-hi:#43291c;
  --lacquer:#c23a2b; --brass:#d8ac52; --jade:#3f8f72;
  --tile-side:#2f7d61; --tb-a:#4aa383; --tb-b:#2c7258; --tb-pat:linear-gradient(transparent,transparent);
  --tw-opp:clamp(17px,2.4vw,27px); --tw-pond:clamp(18px,2.5vw,28px);
  --ivory:#f4ecda; --ivory-edge:#d9ccae; --ink:#1c1a17;
  --text:#eef1e8; --muted:#a8bdb2; --line:rgba(216,172,82,.28);
  --good:#7fd19b; --bad:#ff9a8a;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --body:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --tw-lg:min(42px, calc((100vw - 80px) / 18.2));
  --hand-cw:min(62px, calc((100vw - 40px) / 7.6));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--wood)}
body{margin:0;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;
  background:radial-gradient(120% 80% at 50% 0%, var(--wood-hi), var(--wood) 60%) fixed;min-height:100vh}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* 招牌列 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--wood-hi),var(--wood))}
.brand{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--brass);white-space:nowrap}
.brand small{font-size:13px;color:var(--muted);letter-spacing:.02em;margin-left:8px;font-weight:400}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who label{font-size:13px;color:var(--muted)}
input[type=text]{background:var(--felt-lo);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;width:9.5em;min-width:0}
.net{font-size:12px;color:var(--muted);padding:3px 10px;border:1px solid var(--line);border-radius:99px}

/* 按鈕 */
.btn{border:1px solid var(--line);background:var(--felt-hi);border-radius:10px;padding:8px 14px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:4px}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--lacquer);border-color:#e0685a;color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.big{padding:12px 20px;font-size:16px}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.hu{background:var(--brass);color:var(--ink);font-weight:800;border-color:#f0cf85}

main{padding-block:16px 40px;padding-inline:16px;max-width:1100px;margin:0 auto}

/* 大廳 */
.lobby{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.lobby{grid-template-columns:minmax(0,1fr)}}
.felt{background:radial-gradient(130% 100% at 50% 30%, var(--felt-hi), var(--felt) 55%, var(--felt-lo));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brass)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0 0 8px;font-weight:700}
h2{font-size:24px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.gcard{display:grid;grid-template-rows:64px auto auto auto;justify-items:start;text-align:left;gap:2px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.gcard.on{border-color:var(--brass);background:rgba(216,172,82,.12);box-shadow:0 0 0 1px var(--brass) inset}
.gart{display:flex;align-items:center;gap:3px;height:60px}
.gart svg{height:54px;width:auto}
.glabel{font-family:var(--display);font-size:22px;font-weight:700}
.gsub{font-size:13px;color:var(--muted)}
.gppl{font-size:12px;color:var(--brass)}
.joinrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.joinrow input{width:7em;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg-l{font-size:13px;color:var(--muted);width:5em}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;cursor:pointer}
.seg button.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700}
.rules{font-size:14px;color:#d5dfd8;max-width:65ch}
.rules p{margin:6px 0}
.go{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tlist{display:grid;gap:8px;margin-top:8px}
.trow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;text-align:left;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.trow:hover{border-color:var(--brass)}
.tcode{font-weight:800;letter-spacing:.15em;color:var(--brass)}
.tn{font-variant-numeric:tabular-nums}

/* 等待房 */
.wait{max-width:560px;margin:0 auto}
.code{font-size:18px;display:flex;gap:10px;align-items:center}
.code b{font-size:34px;letter-spacing:.2em;color:var(--brass);font-family:var(--display)}
.seats{list-style:none;padding:0;display:grid;gap:8px}
.seats li{display:flex;gap:10px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:10px}
.seats li.taken{border-style:solid;background:rgba(0,0,0,.18)}
.sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--felt-lo);font-size:12px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted);white-space:nowrap}

/* 牌桌 */
.playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.playhead h2{margin:0;font-size:22px}
.pcode{font-size:13px;color:var(--brass);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.playhead .sp{flex:1}
.msg{min-height:1.6em;font-size:14px;color:#e9e3cf;background:rgba(0,0,0,.25);border-radius:8px;padding:4px 10px;margin-bottom:8px}
.note{font-size:12px;color:var(--bad);min-height:1em}
.tablefelt{position:relative;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px;min-height:40px}
.hint{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}

/* 棋盤 */
.chess-wrap{display:grid;gap:8px;justify-items:center}
.board-box{width:min(100%, 520px)}
.board-box.dk{width:min(100%, 680px)}
.xq-board,.dk-board{width:100%;height:auto;display:block;touch-action:manipulation}
.xq-bg{fill:#e2c08a;stroke:#6d4523;stroke-width:.06}
.xq-l{stroke:#6d4523;stroke-width:.03}
.xq-river{font-family:var(--display);font-size:.5px;fill:#6d4523}
.pc-side{fill:#8a6034}
.pc-disc{fill:#f3dfb2;stroke:#9a7240;stroke-width:.025}
.pc-shine{fill:#fff;opacity:.22;pointer-events:none}
.pc-ring{fill:none;stroke-width:.025}
.pc-r .pc-ring{stroke:var(--lacquer)} .pc-b .pc-ring{stroke:#222}
.pc-txt{font-family:var(--display);font-weight:700;pointer-events:none}
.pc-r .pc-txt{fill:#b3261e} .pc-b .pc-txt{fill:#1c1a17}
.pcb-txt{font-family:var(--display);font-weight:700;pointer-events:none}
.pc-hidden{cursor:pointer}
.pc-hidden:hover{filter:brightness(1.15)}
.xq-cap.hid{stroke:#e2b85c;stroke-dasharray:.12 .07}
.pc-sel .pc-disc{stroke:#1e7a4f;stroke-width:.08}
.pc-sel .pc-side{fill:#1e7a4f}
.pc-last .pc-disc{stroke:#1f5fa8;stroke-width:.08}
.xq-dot{fill:#1e7a4f;pointer-events:none}
.xq-cap{fill:none;stroke:#1e7a4f;stroke-width:.08;pointer-events:none}
.xq-from{fill:#1f5fa8;opacity:.6}
.dk-from{fill:#1f5fa8;opacity:.18}
.hit{fill:transparent;cursor:pointer}
.plate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid transparent;width:min(100%,520px)}
.plate.on{border-color:var(--brass);box-shadow:0 0 12px rgba(216,172,82,.35)}
.plate .sc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--brass)}
.dot{width:12px;height:12px;border-radius:50%;background:#777}
.dot.r{background:var(--lacquer)} .dot.b{background:#111;border:1px solid #888}
.caps{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding-top:4px;border-top:1px solid var(--line);min-height:36px}
.caplbl{font-size:12px;color:var(--muted);margin-right:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.capnone{font-size:12px;color:var(--muted);opacity:.7}
.cap-pc{width:28px;height:29px;flex:none}
.cap-pc.new{animation:capIn .6s ease-out}
@keyframes capIn{0%{transform:scale(1.8);filter:drop-shadow(0 0 6px var(--brass))}100%{transform:none}}
@media (max-width:640px){.cap-pc{width:24px;height:25px}}

/* 麻將牌 */
.tile{--tw:26px;display:inline-block;width:var(--tw);height:calc(var(--tw)*1.34);background:linear-gradient(#fbf6ea,var(--ivory));border-radius:calc(var(--tw)*.14);
  box-shadow:0 calc(var(--tw)*.1) 0 var(--tile-side),0 calc(var(--tw)*.14) 4px rgba(0,0,0,.45);border:1px solid var(--ivory-edge);vertical-align:bottom;position:relative;flex:none}
.tile svg{width:100%;height:100%;display:block;font-family:var(--display)}
.tile.xs{--tw:18px} .tile.sm{--tw:24px} .tile.lg{--tw:var(--tw-lg)} .tile.opp{--tw:var(--tw-opp)} .tile.pondt{--tw:var(--tw-pond)} .tile.lgpv{--tw:30px}
.tile.back{background-image:var(--tb-pat),linear-gradient(135deg,var(--tb-a),var(--tb-b));border-color:var(--tile-side)}
.tile-pv{display:flex;gap:4px;padding-bottom:4px}
.tile.flower{background:linear-gradient(#fff6e8,#f4e2c4)}
.tile.hot{outline:2px solid var(--brass);outline-offset:1px}
.tile.pick{cursor:pointer;transition:transform .12s}
.tile.pick.sel{transform:translateY(-10px);box-shadow:0 calc(var(--tw)*.1) 0 var(--tile-side),0 0 0 2px var(--brass),0 8px 10px rgba(0,0,0,.4)}
.tile.drawn{margin-left:6px}
.meld{display:inline-flex;gap:1px;margin:0 4px 4px 0;padding:2px;border-radius:4px;background:rgba(0,0,0,.2)}
.mj-table{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);grid-template-areas:"top top top" "left mid right" "me me me"}
.mj-opp{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.mj-opp.o2{grid-area:top} .mj-opp.o3{grid-area:left} .mj-opp.o1{grid-area:right}
.mj-opp .mj-ohand{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}
.mj-opp.o1 .mj-ohand,.mj-opp.o3 .mj-ohand{max-width:100%}
.ocnt{font-size:12px;color:var(--muted)}
.mj-melds{display:flex;flex-wrap:wrap;justify-content:center}
.mj-name{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid transparent;flex-wrap:wrap;justify-content:center;max-width:100%}
.mj-name.on{border-color:var(--brass);box-shadow:0 0 10px rgba(216,172,82,.4)}
.mj-name strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:8em}
.mj-name .sc{color:var(--brass);font-variant-numeric:tabular-nums}
.mj-name .cnt{font-size:12px;color:var(--muted)}
.wind{font-family:var(--display);font-weight:700;width:22px;height:22px;display:grid;place-items:center;border-radius:5px;background:var(--ivory);color:var(--ink);font-size:14px}
.wind.dealer{background:var(--lacquer);color:#fff}
.mj-mid{grid-area:mid;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;gap:6px;align-items:center;justify-items:center;background:rgba(0,0,0,.14);border-radius:14px;padding:8px;min-height:220px}
.pond{display:flex;flex-wrap:wrap;gap:2px 2px;align-content:flex-start;justify-content:center;max-width:calc(var(--tw-pond)*6 + 12px);row-gap:5px}
.pond.p0,.pond.p2{max-width:calc(var(--tw-pond)*11 + 22px)}
.mj-opp .meld{margin-bottom:6px}
.pond.p2{grid-column:1/4;grid-row:1} .pond.p3{grid-column:1;grid-row:2} .pond.p1{grid-column:3;grid-row:2} .pond.p0{grid-column:1/4;grid-row:3}
.mj-center{grid-column:2;grid-row:2}
.mj-info{display:grid;gap:2px;text-align:center;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--felt-lo);border:1px solid var(--line);white-space:nowrap}
.mj-info b{color:var(--brass);font-variant-numeric:tabular-nums}
.mj-me{grid-area:me;display:flex;flex-direction:column;align-items:center;gap:6px}
.mj-hand{display:flex;flex-wrap:nowrap;gap:2px;justify-content:center;padding-top:12px;max-width:100%;overflow-x:auto}
.gap{width:6px}
.claim-tile{display:inline-flex}
.btn.chi{padding:4px 8px}
.count{font-variant-numeric:tabular-nums;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--brass);font-weight:700}
.waits{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
@media (max-width:640px){
  :root{--tw-lg:min(42px, calc((100vw - 52px) / 17.6))}
  .felt.tablefelt{padding:8px}
  .mj-hand{gap:1px}
  .mj-table{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"top top" "left right" "mid mid" "me me"}
  .pond{max-width:calc(var(--tw-pond)*6 + 12px)}
  .tile.xs{--tw:15px}
}

/* 撲克牌 */
.card{--cw:52px;display:inline-grid;position:relative;width:var(--cw);height:calc(var(--cw)*1.4);background:#fffdf7;color:var(--ink);border-radius:calc(var(--cw)*.12);
  border:1px solid #cfc4ad;box-shadow:0 2px 5px rgba(0,0,0,.4);flex:none;overflow:hidden;font-family:var(--body)}
.card b{position:absolute;left:8%;top:3%;font-size:calc(var(--cw)*.3);line-height:1;font-weight:800}
.card i{position:absolute;left:9%;top:26%;font-style:normal;font-size:calc(var(--cw)*.22);line-height:1}
.card em{position:absolute;right:8%;bottom:4%;font-style:normal;font-size:calc(var(--cw)*.55);line-height:1}
.card.red{color:#c0302a}
.card.back{background:#8e2a20;border:3px solid #fff6e6}
.card.back::before{content:"";position:absolute;pointer-events:none}
/* 撲克牌背面樣式 */
[data-cb="red"] .card.back:not(.pv),.card.back.pv.cb-red{background:repeating-linear-gradient(45deg,#8e2a20 0 4px,#a8372b 4px 8px)}
[data-cb="blue"] .card.back:not(.pv),.card.back.pv.cb-blue{background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px),#1d4c8c;border-color:#f3f6fb}
[data-cb="blue"] .card.back:not(.pv)::before,.card.back.pv.cb-blue::before{inset:13%;border:1px solid rgba(255,255,255,.6);border-radius:3px}
[data-cb="jade"] .card.back:not(.pv),.card.back.pv.cb-jade{background:radial-gradient(circle,rgba(216,172,82,.55) 0 1px,transparent 1.6px) 0 0/6px 6px,linear-gradient(160deg,#2f7a60,#164a3a);border:2px solid #d8ac52}
[data-cb="jade"] .card.back:not(.pv)::before,.card.back.pv.cb-jade::before{left:50%;top:50%;width:calc(var(--cw)*.34);height:calc(var(--cw)*.34);transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid #d8ac52;background:#164a3a;box-shadow:0 0 0 2px #164a3a}
[data-cb="noir"] .card.back:not(.pv),.card.back.pv.cb-noir{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(216,172,82,.3) 0 5deg,transparent 5deg 15deg),#141210;border:2px solid #d8ac52}
[data-cb="noir"] .card.back:not(.pv)::before,.card.back.pv.cb-noir::before{left:50%;top:50%;width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);transform:translate(-50%,-50%);border-radius:50%;background:#141210;border:1.5px solid #d8ac52}
[data-cb="star"] .card.back:not(.pv),.card.back.pv.cb-star{background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,#fff 0 .8px,transparent 1.3px),radial-gradient(circle at 45% 80%,#ffe9a8 0 1px,transparent 1.6px),radial-gradient(circle at 80% 15%,#fff 0 .7px,transparent 1.2px),linear-gradient(#41246c,#170b30);
  background-size:14px 17px,11px 13px,19px 15px,9px 11px,100% 100%;border:2px solid #e6dcff}
[data-cb="star"] .card.back:not(.pv)::before,.card.back.pv.cb-star::before{left:50%;top:50%;width:calc(var(--cw)*.26);height:calc(var(--cw)*.26);transform:translate(-50%,-50%);border-radius:50%;box-shadow:inset calc(var(--cw)*-.07) calc(var(--cw)*-.03) 0 0 #ffe9a8}
[data-cb="plaid"] .card.back:not(.pv),.card.back.pv.cb-plaid{background:repeating-linear-gradient(0deg,rgba(255,214,120,.35) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,rgba(255,214,120,.35) 0 1px,transparent 1px 10px),repeating-linear-gradient(0deg,rgba(10,20,40,.45) 0 4px,transparent 4px 10px),repeating-linear-gradient(90deg,rgba(10,20,40,.45) 0 4px,transparent 4px 10px),#7d1d2c;border-color:#f6eedd}
.card.xs{--cw:26px} .card.sm{--cw:38px}
.card.pick{--cw:var(--hand-cw);cursor:pointer;transition:transform .12s}
.card.pick.sel{transform:translateY(-14px);box-shadow:0 0 0 2px var(--brass),0 8px 12px rgba(0,0,0,.5)}
.card.hasmatch{box-shadow:0 0 0 2px var(--jade),0 2px 5px rgba(0,0,0,.4)}
.card.tbl.can{cursor:pointer;box-shadow:0 0 0 3px var(--brass),0 0 14px rgba(216,172,82,.6)}
.hand{display:flex;justify-content:center;padding-top:16px;max-width:100%}
.hand .card+.card{margin-left:calc(var(--cw) * -.38)}
.fan{display:flex;justify-content:center}
.fan .card+.card{margin-left:-18px}
.cg-table{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);grid-template-areas:"top top top" "left mid right" "me me me"}
.cg-opp{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cg-opp.o2{grid-area:top} .cg-opp.o3{grid-area:left} .cg-opp.o1{grid-area:right}
.cg-mid{grid-area:mid;display:grid;place-items:center;min-height:120px;background:rgba(0,0,0,.14);border-radius:14px;padding:10px}
.cg-me{grid-area:me;display:flex;flex-direction:column;align-items:center;gap:6px}
.lp{min-height:56px;display:flex;align-items:center}
.lp .played{display:inline-flex;gap:2px}
.cg-mid .played{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.pass.on{color:var(--brass);border-color:var(--brass)}
.pass{font-weight:800;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.lead-lbl{font-size:13px;color:var(--muted)}
.selname{min-width:4em;font-size:14px;color:var(--brass)} .selname.bad{color:var(--bad)}
.got{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:100%}
.cg-mid.pr{grid-template-columns:auto 1fr auto;gap:10px}
.tablecards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* 結算 */
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,20,16,.6);border-radius:18px;padding:12px;z-index:3}
.res-card{background:var(--felt);border:1px solid var(--brass);border-radius:16px;padding:18px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.res-card h3{font-size:24px;color:var(--brass)}
.res-card h3 small{font-size:14px;color:var(--muted)}
.res-hand{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.tai{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.tai td{padding:4px 6px;border-bottom:1px solid var(--line)} .tai td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tai .sum td{font-weight:800;color:var(--brass)}
.lefthand{display:flex;flex-wrap:wrap;gap:1px}
.pay,.scores{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;margin-top:8px}
.up{color:var(--good)} .down{color:var(--bad)}
.peek{position:absolute;right:12px;top:12px;z-index:2}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ivory);color:var(--ink);padding:10px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20;max-width:calc(100vw - 32px);font-weight:600}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:15}
.dlg .res-card{max-height:85vh}
/* 洗牌動畫：牌堆左右切開、交錯落回（兩次），再往四家發出 */
.shuffle-fx{position:absolute;inset:0;z-index:4;pointer-events:none;display:grid;place-items:center;border-radius:18px;background:rgba(8,20,15,.35)}
.fx-deck{position:relative;width:52px;height:73px}
.fx-c{position:absolute;left:0;top:0;--cw:52px;animation:riffle 1.3s ease-in-out both;animation-delay:calc(var(--i) * 12ms)}
@keyframes riffle{
  0%{transform:translate(0,calc(var(--i) * -1px))}
  18%{transform:translate(var(--dx),calc(var(--i) * -1px)) rotate(var(--rot))}
  36%{transform:translate(0,calc(var(--i) * -1px))}
  54%{transform:translate(var(--dx),calc(var(--i) * -1px)) rotate(var(--rot))}
  72%,100%{transform:translate(0,calc(var(--i) * -1px))}
}
.fx-c.l{--dx:-46px;--rot:-8deg} .fx-c.r{--dx:46px;--rot:8deg}
.fx-lbl{position:absolute;top:calc(50% + 50px);font-family:var(--display);color:var(--brass);letter-spacing:.2em}
.fx-deal{position:absolute;left:calc(50% - 19px);top:calc(50% - 26px);--cw:38px;opacity:0;animation:deal .45s ease-out both;animation-delay:calc(1.3s + var(--j) * 180ms)}
.fx-deal.d0{--tx:0;--ty:40vh} .fx-deal.d1{--tx:40vw;--ty:0} .fx-deal.d2{--tx:0;--ty:-40vh} .fx-deal.d3{--tx:-40vw;--ty:0}
.fx-deal.d1{animation-delay:calc(1.3s + var(--j) * 180ms + 45ms)} .fx-deal.d2{animation-delay:calc(1.3s + var(--j) * 180ms + 90ms)} .fx-deal.d3{animation-delay:calc(1.3s + var(--j) * 180ms + 135ms)}
@keyframes deal{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(200deg)}}
.hand.dealing .card{animation:dealIn .35s ease-out both;animation-delay:calc(1.4s + var(--k) * 55ms)}
@keyframes dealIn{0%{opacity:0;transform:translateY(-60px) scale(.7)}100%{opacity:1;transform:none}}

.pile{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}

/* 德州撲克 */
.he-mid{display:grid;gap:8px;justify-items:center}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

  <div class="who"><label for="nameIn">暱稱</label><input type="text" id="nameIn" maxlength="16" autocomplete="off"><span class="net" id="netStatus">連線準備中…</span><button class="btn ghost sm icon" id="muteBtn" data-act="mute" aria-label="靜音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="slash" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="btn ghost sm" data-act="look">設定</button></div>

  <section id="v-lobby">

<div class="toast" id="toast" hidden></div>

<script>
/* ===== 共用工具 ===== */
const GAMES = {};
function rnd(n){ // 0..n-1，優先用瀏覽器的密碼學亂數
  try { if (typeof crypto!=='undefined' && crypto.getRandomValues){ const lim=Math.floor(4294967296/n)*n; const u=new Uint32Array(1); do { crypto.getRandomValues(u); } while (u[0]>=lim); return u[0]%n; } } catch(e){}
  return Math.floor(Math.random()*n);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function sfx(S, k){ if (S && S.fx) S.fx.ks.push(k); }
function pick(a){return a[Math.floor(Math.random()*a.length)];}

/* ===== 象棋引擎（標準象棋 + 大盤暗棋共用）=====
   board[i] = null | {c:'r'|'b', t:'KABRNCP', up:bool, s:'KABRNCP'(暗子所在位置的兵種)}
   i = r*9+c；r=0 黑方底線，r=9 紅方底線 */
const XQ = (() => {
  const W = 9, H = 10;
  const NAME = { r:{K:'帥',A:'仕',B:'相',R:'俥',N:'傌',C:'炮',P:'兵'}, b:{K:'將',A:'士',B:'象',R:'車',N:'馬',C:'包',P:'卒'} };
  const VAL = { K:10000, R:90, N:40, C:45, A:20, B:20, P:10 };
  const BACK = 'RNBAKABNR';
  function startLayout(){ // 回傳 [[i,color,type],...]
    const L = [];
    for (let c=0;c<9;c++){ L.push([c,'b',BACK[c]]); L.push([81+c,'r',BACK[c]]); }
    L.push([19,'b','C'],[25,'b','C'],[64,'r','C'],[70,'r','C']);
    for (const c of [0,2,4,6,8]){ L.push([27+c,'b','P']); L.push([54+c,'r','P']); }
    return L;
  }
  const inPalace = (c,r,col) => col>=3 && col<=5 && (c==='r' ? r>=7 : r<=2);
  const ownSide = (c,r) => c==='r' ? r>=5 : r<=4;
  const opp = c => c==='r'?'b':'r';
  // 產生某子的所有落點（偽合法）
  function pieceMoves(b, i, jie, out){
    const p = b[i]; const r = (i/9)|0, col = i%9;
    const t = p.up ? p.t : p.s;
    const restrict = !jie || !p.up;
    const add = (rr,cc) => { if (rr<0||rr>=H||cc<0||cc>=W) return; const j=rr*9+cc; const q=b[j]; if (!q || q.c!==p.c) out.push(i*100+j); };
    switch (t){
      case 'K': for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const rr=r+dr,cc=col+dc; if (inPalace(p.c,rr,cc)) add(rr,cc); } break;
      case 'A': for (const [dr,dc] of [[1,1],[1,-1],[-1,1],[-1,-1]]){ const rr=r+dr,cc=col+dc; if (!restrict || inPalace(p.c,rr,cc)) add(rr,cc); } break;
      case 'B': for (const [dr,dc] of [[2,2],[2,-2],[-2,2],[-2,-2]]){ const rr=r+dr,cc=col+dc; if (rr<0||rr>=H||cc<0||cc>=W) continue; if (b[(r+dr/2)*9+col+dc/2]) continue; if (restrict && !ownSide(p.c,rr)) continue; add(rr,cc); } break;
      case 'N': for (const [dr,dc,lr,lc] of [[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0],[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1]]){ const rr=r+dr,cc=col+dc; if (rr<0||rr>=H||cc<0||cc>=W) continue; if (b[(r+lr)*9+col+lc]) continue; add(rr,cc); } break;
      case 'R': for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ let rr=r+dr,cc=col+dc; while (rr>=0&&rr<H&&cc>=0&&cc<W){ const q=b[rr*9+cc]; if (!q) out.push(i*100+rr*9+cc); else { if (q.c!==p.c) out.push(i*100+rr*9+cc); break; } rr+=dr; cc+=dc; } } break;
      case 'C': for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ let rr=r+dr,cc=col+dc, jumped=false; while (rr>=0&&rr<H&&cc>=0&&cc<W){ const q=b[rr*9+cc]; if (!jumped){ if (!q) out.push(i*100+rr*9+cc); else jumped=true; } else if (q){ if (q.c!==p.c) out.push(i*100+rr*9+cc); break; } rr+=dr; cc+=dc; } } break;
      case 'P': { const f = p.c==='r'?-1:1; add(r+f,col); if (!ownSide(p.c,r)){ add(r,col-1); add(r,col+1); } } break;
    }
  }
  function allMoves(b, c, jie){ const out=[]; for (let i=0;i<90;i++){ const p=b[i]; if (p && p.c===c) pieceMoves(b,i,jie,out); } return out; }
  function findKing(b,c){ for (let i=0;i<90;i++){ const p=b[i]; if (p&&p.c===c&&p.up&&p.t==='K') return i; } return -1; }
  function inCheck(b, c, jie){
    const k = findKing(b,c); if (k<0) return true;
    const e = opp(c);
    // 王見王
    const ek = findKing(b,e);
    if (ek>=0 && ek%9===k%9){ let clear=true; const a=Math.min(k,ek), z=Math.max(k,ek); for (let j=a+9;j<z;j+=9) if (b[j]){clear=false;break;} if (clear) return true; }
    const out=[]; for (let i=0;i<90;i++){ const p=b[i]; if (p&&p.c===e){ out.length=0; pieceMoves(b,i,jie,out); for (const m of out) if (m%100===k) return true; } }
    return false;
  }
  function legalMoves(b, c, jie){
    const res=[];
    for (const m of allMoves(b,c,jie)){ const f=(m/100)|0, t=m%100; const cap=b[t]; b[t]=b[f]; b[f]=null; if (!inCheck(b,c,jie)) res.push(m); b[f]=b[t]; b[t]=cap; }
    return res;
  }
  // ---- AI：alpha-beta ----
  function pval(p, i){
    if (!p.up) return 38;
    let v = VAL[p.t];
    if (p.t==='P'){ const r=(i/9)|0; if (!ownSide(p.c,r)) { v += 12; const adv = p.c==='r' ? 4-r : r-5; if (adv>=0 && adv<=2) v += 6; } }
    if (p.t==='N'||p.t==='R'||p.t==='C'){ const c=i%9; v += (c>=2&&c<=6)?3:0; }
    return v;
  }
  function evalBoard(b, c){ let s=0; for (let i=0;i<90;i++){ const p=b[i]; if (p) s += (p.c===c?1:-1)*pval(p,i); } return s; }
  function search(b, c, depth, alpha, beta, jie, deadline){
    if (depth===0) return evalBoard(b,c);
    const moves = allMoves(b,c,jie);
    // MVV 排序
    moves.sort((x,y)=>{ const a=b[x%100], z=b[y%100]; return (z?VAL[z.up?z.t:'P']:0)-(a?VAL[a.up?a.t:'P']:0); });
    let best = -1e9;
    for (const m of moves){
      const f=(m/100)|0, t=m%100; const cap=b[t];
      if (cap && cap.up && cap.t==='K') return 9000+depth;
      b[t]=b[f]; b[f]=null;
      let sc;
      // 王見王的非法步直接略過
      const k1=findKing(b,c), k2=findKing(b,opp(c)); let face=false;
      if (k1>=0&&k2>=0&&k1%9===k2%9){ face=true; const a=Math.min(k1,k2),z=Math.max(k1,k2); for (let j=a+9;j<z;j+=9) if (b[j]){face=false;break;} }
      if (face) sc=-1e8; else sc = -search(b, opp(c), depth-1, -beta, -alpha, jie, deadline);
      b[f]=b[t]; b[t]=cap;
      if (sc>best) best=sc;
      if (best>alpha) alpha=best;
      if (alpha>=beta) break;
      if (Date.now()>deadline) break;
    }
    return best;
  }
  function bestMove(b, c, jie, depth){
    const legal = legalMoves(b,c,jie); if (!legal.length) return null;
    const deadline = Date.now()+900;
    let best=null, bs=-1e9;
    const scored = legal.map(m=>{ const t=b[m%100]; return [m, t?VAL[t.up?t.t:'P']:0]; }).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
    for (const m of scored){
      const f=(m/100)|0, t=m%100; const cap=b[t];
      b[t]=b[f]; b[f]=null;
      // 暗子翻開後身分未知，搜尋時沿用位置兵種
      const sc = -search(b, opp(c), depth-1, -1e9, -bs, jie, deadline) + Math.random()*4;
      b[f]=b[t]; b[t]=cap;
      if (sc>bs){ bs=sc; best=m; }
      if (Date.now()>deadline) break;
    }
    return best;
  }
  return { NAME, startLayout, legalMoves, inCheck, bestMove, opp, VAL };
})();

/* ---------- 標準象棋 / 大盤暗棋 共用的遊戲包裝 ---------- */
function makeXQGame(jie){
  return {
    create(n, opts, prev){
      const b = new Array(90).fill(null);
      const L = XQ.startLayout();
      if (!jie){ for (const [i,c,t] of L) b[i]={c,t,up:true,s:t}; }
      else {
        for (const col of ['r','b']){
          const mine = L.filter(x=>x[1]===col);
          const others = mine.filter(x=>x[2]!=='K');
          const types = shuffle(others.map(x=>x[2]));
          others.forEach((x,k)=>{ b[x[0]]={c:col,t:types[k],up:false,s:x[2]}; });
          const k = mine.find(x=>x[2]==='K'); b[k[0]]={c:col,t:'K',up:true,s:'K'};
        }
      }
      const score = prev ? prev.score : [0,0];
      // 上一局輸的一方先手（紅方）— 簡化：交換顏色
      const red = prev ? 1-prev.red : 0;
      return { b, red, turn:'r', last:null, over:false, winner:null, msg:'紅方先走', quiet:0, score, caps:{r:[],b:[]} };
    },
    seatColor(S, seat){ return seat===S.red ? 'r' : 'b'; },
    turn(S){ if (S.over) return []; return [S.turn==='r' ? S.red : 1-S.red]; },
    act(S, seat, a){
      if (S.over) return '本局已結束';
      const col = seat===S.red?'r':'b';
      if (col!==S.turn) return '還沒輪到你';
      if (a.t==='resign'){ this._end(S, XQ.opp(col), (col==='r'?'紅方':'黑方')+'認輸'); return null; }
      if (a.t!=='mv') return '無效動作';
      const m = a.f*100+a.to;
      const legal = XQ.legalMoves(S.b, col, jie);
      if (!legal.includes(m)) return '這步不合規則（可能會被將軍）';
      const cap = S.b[a.to];
      const p = S.b[a.f];
      S.b[a.to]=p; S.b[a.f]=null;
      let flip = '';
      if (!p.up){ p.up=true; flip = '，翻開是「'+XQ.NAME[p.c][p.t]+'」'; }
      if (cap){ cap.up=true; S.caps[col].push(cap.c+cap.t); S.quiet=0; sfx(S,'cap'); } else { S.quiet++; sfx(S,'move'); }
      S.last=[a.f,a.to];
      S.turn = XQ.opp(col);
      const who = col==='r'?'紅方':'黑方';
      S.msg = who + (cap ? '吃掉「'+XQ.NAME[cap.c][cap.t]+'」' : '走棋') + flip;
      const oppMoves = XQ.legalMoves(S.b, S.turn, jie);
      const chk = XQ.inCheck(S.b, S.turn, jie);
      if (!oppMoves.length){ this._end(S, col, chk ? who+'將死對手！' : '對手無子可動，'+who+'獲勝'); }
      else if (S.quiet>=120){ S.over=true; S.winner=null; S.msg='60 回合沒有吃子，和棋'; }
      else if (chk){ S.msg += '　將軍！'; sfx(S,'check'); }
      return null;
    },
    _end(S, col, msg){ S.over=true; S.winner=col; S.msg=msg; const seat = col==='r'?S.red:1-S.red; S.score[seat]++; },
    bot(S, seat){
      const col = seat===S.red?'r':'b';
      // AI 不偷看暗子：搜尋用的棋盤把暗子當作位置兵種
      const vb = S.b.map(p=>p?{c:p.c,t:p.up?p.t:p.s,up:p.up,s:p.s}:null);
      const m = XQ.bestMove(vb, col, jie, jie?3:4);
      if (m==null) return {t:'resign'};
      return {t:'mv', f:(m/100)|0, to:m%100};
    },
    view(S){
      // 棋盤字串：大寫紅、小寫黑；暗子 紅='*' 黑='#'
      let s='';
      for (const p of S.b){ if (!p) s+='.'; else if (!p.up) s+=(p.c==='r'?'*':'#'); else s+=(p.c==='r'?p.t:p.t.toLowerCase()); }
      return { b:s, red:S.red, turn:S.turn, last:S.last, over:S.over, winner:S.winner, msg:S.msg, score:S.score, caps:S.caps,
               chk: !S.over && XQ.inCheck(S.b, S.turn, jie) };
    },
    legalFor(V, seat, jieFlag){ return null; }
  };
}
GAMES.xq = Object.assign(makeXQGame(false), { id:'xq', name:'象棋', seats:2 });
GAMES.jie = Object.assign(makeXQGame(true), { id:'jie', name:'大盤暗棋', seats:2 });

/* 客戶端要計算合法步（顯示提示），用 view 重建棋盤 */
function xqBoardFromView(V){
  const b=new Array(90).fill(null);
  const L = XQ.startLayout(); const sq = {}; for (const [i,c,t] of L) sq[i]=t;
  for (let i=0;i<90;i++){ const ch=V.b[i]; if (ch==='.') continue;
    if (ch==='*'||ch==='#') b[i]={c:ch==='*'?'r':'b', t:sq[i]||'P', up:false, s:sq[i]||'P'};
    else { const c = ch===ch.toUpperCase()?'r':'b'; const t=ch.toUpperCase(); b[i]={c,t,up:true,s:t}; } }
  return b;
}

/* ===== 半盤暗棋（4×8，台灣翻翻棋）=====
   大小：帥將7 仕士6 相象5 俥車4 傌馬3 炮包2 兵卒1；將不能吃卒、卒可吃將；炮隔一子跳吃，可吃任何子。
   連吃模式：吃子後同一顆可以繼續吃，也可以按「結束」。 */
const DK = (() => {
  const RANK = {K:7,A:6,B:5,R:4,N:3,C:2,P:1};
  const PTS = {K:30,A:12,B:9,R:7,N:5,C:8,P:3};
  const SET = 'KAABBRRNNCCPPPPP';
  const R=4, C=8;
  function canEat(a, d){ // a 吃 d（非炮）
    if (a==='K' && d==='P') return false;
    if (a==='P' && d==='K') return true;
    return RANK[a] >= RANK[d];
  }
  // 某子的所有動作 [{f,to,cap,hid}]；hidOk=可以直接吃蓋著的棋子
  function movesOf(b, i, onlyCap, hidOk){
    const p=b[i]; const out=[]; const r=(i/C)|0, c=i%C;
    for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const rr=r+dr, cc=c+dc; if (rr<0||rr>=R||cc<0||cc>=C) continue;
      const j=rr*C+cc, q=b[j];
      if (!q){ if (!onlyCap) out.push({f:i,to:j,cap:false}); }
      else if (p.t!=='C'){
        if (q.up){ if (q.c!==p.c && canEat(p.t,q.t)) out.push({f:i,to:j,cap:true}); }
        else if (hidOk) out.push({f:i,to:j,cap:true,hid:true});
      }
      if (p.t==='C'){ // 隔一子跳吃
        let rr2=rr, cc2=cc, jumped=false;
        while (rr2>=0&&rr2<R&&cc2>=0&&cc2<C){ const q2=b[rr2*C+cc2];
          if (!jumped){ if (q2) jumped=true; }
          else if (q2){
            if (q2.up){ if (q2.c!==p.c) out.push({f:i,to:rr2*C+cc2,cap:true}); }
            else if (hidOk) out.push({f:i,to:rr2*C+cc2,cap:true,hid:true});
            break; }
          rr2+=dr; cc2+=dc; }
      }
    }
    return out;
  }
  function allActs(b, col, hidOk){
    const out=[];
    for (let i=0;i<32;i++){ const p=b[i]; if (!p) continue;
      if (!p.up) out.push({flip:i});
      else if (p.c===col) out.push(...movesOf(b,i,false,hidOk)); }
    return out;
  }
  // 位置 i 的明子會不會被對手的明子吃
  function threatened(b, i){
    const p=b[i]; if (!p) return false;
    for (let j=0;j<32;j++){ const q=b[j]; if (!q||!q.up||q.c===p.c) continue;
      for (const m of movesOf(b,j,true,false)) if (m.to===i) return true; }
    return false;
  }
  return { RANK, PTS, SET, canEat, movesOf, allActs, threatened, R, C };
})();

GAMES.dark = {
  id:'dark', name:'暗棋', seats:2,
  create(n, opts, prev){
    const pcs=[]; for (const col of ['r','b']) for (const t of DK.SET) pcs.push({c:col,t,up:false});
    shuffle(pcs);
    const score = prev ? prev.score : [0,0];
    const first = prev ? 1-prev.first : 0;
    return { b:pcs, chain:!!opts.chain, hid: opts.hid!==false, cols:[null,null], turn:first, first, cur:null, last:null, over:false, winner:null,
      msg:'翻開第一顆棋子決定顏色', quiet:0, score, dead:[] };
  },
  turn(S){ return S.over?[]:[S.turn]; },
  act(S, seat, a){
    if (S.over) return '本局已結束';
    if (seat!==S.turn) return '還沒輪到你';
    const col = S.cols[seat];
    const name = s => (S.cols[s]==='r'?'紅方':S.cols[s]==='b'?'黑方':'玩家'+(s+1));
    const nm = p => '「'+XQ.NAME[p.c][p.t]+'」';
    if (a.t==='end'){ if (S.cur==null) return '無法結束'; S.cur=null; this._next(S); return null; }
    if (S.cur!=null && a.t!=='mv') return '連吃中：只能繼續吃，或按結束連吃';
    if (a.t==='flip'){
      const p=S.b[a.i]; if (!p||p.up) return '不能翻這裡';
      p.up=true;
      if (!col){ S.cols[seat]=p.c; S.cols[1-seat]=p.c==='r'?'b':'r'; }
      S.msg = name(seat)+'翻出'+nm(p); sfx(S,'flip');
      S.last=[a.i]; S.quiet=0;
      this._next(S); return null;
    }
    if (a.t==='mv'){
      if (!col) return '請先翻棋';
      if (S.cur!=null && a.f!==S.cur) return '連吃只能用同一顆棋子';
      const p=S.b[a.f]; if (!p||!p.up||p.c!==col) return '這不是你的棋';
      // 連吃中只能吃，不能往空格走
      const ms = DK.movesOf(S.b, a.f, S.cur!=null, S.hid);
      const m = ms.find(x=>x.to===a.to); if (!m) return S.cur!=null ? '連吃中只能繼續吃，不能走到空格' : '這步不合規則';
      const cap=S.b[a.to];
      if (cap && !cap.up){ // 直接吃蓋著的棋子：先翻開
        cap.up=true; S.quiet=0;
        const ok = cap.c!==p.c && (p.t==='C' || DK.canEat(p.t,cap.t));
        if (!ok){
          S.last=[a.f,a.to];
          S.msg = name(seat)+nm(p)+'去吃暗子，翻開是'+nm(cap)+(cap.c===p.c?'（自己的棋）':'（吃不動）'); sfx(S,'flip');
          S.cur=null; this._next(S); return null;
        }
        S.msg = name(seat)+nm(p)+'吃暗子，吃掉'+nm(cap);
      } else if (cap){ S.quiet=0; S.msg=name(seat)+nm(p)+'吃掉'+nm(cap); }
      else { S.quiet++; S.msg=name(seat)+'移動'+nm(p); }
      if (cap){ S.dead.push(cap.c+cap.t); sfx(S,'cap'); } else sfx(S,'move');
      S.b[a.to]=p; S.b[a.f]=null; S.last=[a.f,a.to];
      S.prevMv=S.prevMv||{}; S.prevMv[seat]=[a.f,a.to];
      const oc = col==='r'?'b':'r';
      if (!S.b.some(q=>q&&q.c===oc)){ this._win(S, seat, name(seat)+'吃光對手，獲勝！'); return null; }
      if (cap && S.chain && DK.movesOf(S.b, a.to, true, S.hid).length){ S.cur=a.to; S.msg+='（可以繼續吃）'; return null; }
      S.cur=null; this._next(S); return null;
    }
    return '無效動作';
  },
  _win(S, seat, msg){ S.over=true; S.winner=seat; S.score[seat]++; S.msg=msg; },
  _next(S){
    S.turn=1-S.turn;
    if (S.quiet>=50){ S.over=true; S.winner=null; S.msg='連續 50 步沒有吃子或翻棋，和棋'; return; }
    const col=S.cols[S.turn];
    const acts = DK.allActs(S.b, col, S.hid);
    if (!acts.length){ this._win(S, 1-S.turn, '對手無棋可走，'+(S.cols[1-S.turn]==='r'?'紅方':'黑方')+'獲勝！'); }
  },
  // 還沒翻開的棋子有哪些（電腦只用看得到的資訊推算）
  _pool(S){
    const cnt={}; for (const c of ['r','b']) for (const t of DK.SET){ cnt[c+t]=(cnt[c+t]||0)+1; }
    for (const p of S.b) if (p && p.up) cnt[p.c+p.t]--;
    for (const k of S.dead) cnt[k]--;
    const list=[]; for (const k in cnt) for (let i=0;i<cnt[k];i++) list.push(k);
    return list;
  },
  // 用某子去吃暗子的期望值
  _hidEV(S, mover, col, pool){
    if (!pool.length) return 0;
    let ev=0;
    for (const k of pool){
      const c=k[0], t=k[1];
      if (c!==col && (mover.t==='C' || DK.canEat(mover.t,t))) ev += DK.PTS[t]*2;
      else if (c!==col && mover.t!=='C' && DK.canEat(t,mover.t)) ev -= DK.PTS[mover.t]*1.4; // 翻出大子會被反吃
      else ev += 0.3;
    }
    return ev/pool.length;
  },
  bot(S, seat){
    const col=S.cols[seat]; const b=S.b;
    // 電腦不偷看：暗子一律當作未知
    const vis = b.map(p=>p?(p.up?p:{c:'?',t:'?',up:false}):null);
    const pool=this._pool(S);
    if (S.cur!=null){
      const ms=DK.movesOf(vis,S.cur,true,S.hid);
      const mover=vis[S.cur];
      // 留在原地的風險
      let bs = 0.5 - (DK.threatened(vis,S.cur) ? DK.PTS[mover.t]*2 : 0);
      let best=null;
      for (const m of ms){
        let sc;
        if (m.hid) sc = this._hidEV(S,mover,col,pool);
        else {
          const tgt=vis[m.to]; sc = tgt ? DK.PTS[tgt.t]*2 : 0;
          const sim=vis.slice(); sim[m.to]=mover; sim[m.f]=null; if (DK.threatened(sim,m.to)) sc -= DK.PTS[mover.t]*2;
          if (!tgt) sc -= 0.3;   // 沒必要就不亂走
        }
        if (sc>bs){bs=sc;best=m;}
      }
      return best ? {t:'mv',f:best.f,to:best.to} : {t:'end'};
    }
    if (!col) return {t:'flip', i: pick(b.map((p,i)=>p&&!p.up?i:-1).filter(i=>i>=0))};
    const acts = DK.allActs(vis, col, S.hid);
    let best=null, bs=-1e9;
    for (const a of acts){
      let sc;
      if (a.flip!=null){
        sc = 1 + Math.random()*2 + S.quiet*0.12;
        const r=(a.flip/8)|0,c=a.flip%8; let adjEnemyBig=0;
        for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const rr=r+dr,cc=c+dc; if (rr<0||rr>=4||cc<0||cc>=8) continue; const q=vis[rr*8+cc]; if (q&&q.up&&q.c!==col&&DK.RANK[q.t]>=5) adjEnemyBig++; }
        sc -= adjEnemyBig*1.5;
      } else if (a.hid){
        const mover=vis[a.f];
        sc = this._hidEV(S, mover, col, pool) + (DK.threatened(vis,a.f)? -1 : 0) + Math.random()*0.5;
      } else {
        const mover=vis[a.f]; const tgt=vis[a.to];
        const sim=vis.slice(); sim[a.to]=mover; sim[a.f]=null;
        const wasThreat = DK.threatened(vis,a.f);
        const willThreat = DK.threatened(sim,a.to);
        sc = 0;
        if (tgt) sc += DK.PTS[tgt.t]*2;
        if (willThreat) sc -= DK.PTS[mover.t]*2;
        if (wasThreat && !willThreat) sc += DK.PTS[mover.t]*1.6;
        if (!tgt && !wasThreat) sc -= 0.5;
        if (!tgt && !willThreat && mover.t!=='C'){
          const dist=(x,y)=>Math.abs((x/8|0)-(y/8|0))+Math.abs(x%8-y%8);
          let bb=0; for (let j=0;j<32;j++){ const q=vis[j]; if (!q||!q.up||q.c===col||!DK.canEat(mover.t,q.t)||(DK.canEat(q.t,mover.t)&&q.t!=='C')) continue; const g=dist(a.f,j)-dist(a.to,j); if (g>0) bb=Math.max(bb, DK.PTS[q.t]*0.3/dist(a.to,j)); }
          sc += bb;
        }
        const pv=(S.prevMv||{})[seat]; if (pv && pv[0]===a.to && pv[1]===a.f) sc -= 1.5; // 別來回走
        sc += Math.random()*0.3;
      }
      if (sc>bs){bs=sc;best=a;}
    }
    if (!best) return null;
    if (best.flip!=null) return {t:'flip', i:best.flip};
    return {t:'mv', f:best.f, to:best.to};
  },
  view(S){
    let s=''; for (const p of S.b){ if (!p) s+='.'; else if (!p.up) s+='?'; else s+=(p.c==='r'?p.t:p.t.toLowerCase()); }
    return { b:s, cols:S.cols, turn:S.turn, cur:S.cur, last:S.last, over:S.over, winner:S.winner, msg:S.msg, score:S.score, chain:S.chain, hid:S.hid, quiet:S.quiet, dead:S.dead };
  }
};
function dkBoardFromView(V){
  return V.b.split('').map(ch=> ch==='.'?null: ch==='?'?{c:'?',t:'?',up:false} : {c: ch===ch.toUpperCase()?'r':'b', t:ch.toUpperCase(), up:true});
}

/* ===== 台灣十六張麻將 =====
   牌編號：0-8 萬、9-17 筒、18-26 條、27-30 東南西北、31-33 中發白、34-41 花（春夏秋冬梅蘭竹菊） */
const MJ = (() => {
  const SUIT = t => t<27 ? (t/9|0) : 3;
  const isHonor = t => t>=27 && t<34;
  const isFlower = t => t>=34;
  const WIND = ['東','南','西','北'];
  function tileName(t){
    if (t<27){ const n=t%9+1; return '一二三四五六七八九'[n-1] + ['萬','筒','條'][SUIT(t)]; }
    if (t<31) return WIND[t-27]+'風';
    if (t<34) return ['紅中','青發','白板'][t-31];
    return '春夏秋冬梅蘭竹菊'[t-34];
  }
  function counts(tiles){ const c=new Array(34).fill(0); for (const t of tiles) if (t<34) c[t]++; return c; }
  // 是否能組成 N 組 + 1 對
  function canWinCounts(c){
    for (let i=0;i<34;i++) if (c[i]>=2){ c[i]-=2; const ok=sets(c,0); c[i]+=2; if (ok) return true; }
    return false;
  }
  function sets(c, i){
    while (i<34 && c[i]===0) i++;
    if (i>=34) return true;
    if (c[i]>=3){ c[i]-=3; const ok=sets(c,i); c[i]+=3; if (ok) return true; }
    if (i<27 && i%9<=6 && c[i+1] && c[i+2]){ c[i]--;c[i+1]--;c[i+2]--; const ok=sets(c,i); c[i]++;c[i+1]++;c[i+2]++; if (ok) return true; }
    return false;
  }
  // 所有拆法：[{pair, sets:[['s',i]|['t',i]]}]
  function decompose(c){
